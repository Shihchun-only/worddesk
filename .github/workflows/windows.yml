name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm test
      - run: pnpm package
      - name: Zip portable app
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "dist/WordDesk-$version-win32-x64" -DestinationPath "dist/WordDesk-$version-win32-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WordDesk-windows-x64
          path: dist/*.zip
          retention-days: 30
